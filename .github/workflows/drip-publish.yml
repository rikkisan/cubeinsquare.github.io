name: Drip Publish

on:
  schedule:
    - cron: '0 9 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate and assemble the next release without committing or pushing'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: drip-publish
  cancel-in-progress: false

jobs:
  publish-next-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Used to syntax-check assets/site.js after a TOOL_META.js merge. That
      # file drives navigation on every page, so a syntax error there must
      # never reach a commit.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish next queued release
        shell: bash
        env:
          DRIP_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: bash .github/scripts/drip-publish.sh
